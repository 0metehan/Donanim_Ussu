spring.application.name=Donanim_Ussu

# Kisisel veritabani bilgileri application-local.properties dosyasina yazilir (git'e gitmez).
# Ornek icin: application-local.properties.example
spring.config.import=optional:classpath:application-local.properties

# MySQL baglantisi (varsayilanlar ortam degiskenleriyle ya da local dosyayla ezilebilir)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/donanim_ussu?createDatabaseIfNotExist=true&serverTimezone=Europe/Istanbul}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
